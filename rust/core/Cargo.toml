[package]
name = "perch-core"
description = "Perch's data and logic, shared by every platform: settings, to-do tasks, water, calendar, lyrics, Ask Perch, updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
dirs = "5.0.1"
serde_json = "1.0.132"
# Web requests over the system's own TLS (Windows SChannel, macOS Security framework, OpenSSL on Linux).
ureq = { version = "2.10.1", default-features = false, features = ["native-tls"] }
native-tls = "0.2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
